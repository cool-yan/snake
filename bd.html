<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>生日快乐 🎂</title>
<style>
  :root{
    --gold:#ffd166;
    --pink:#ff5f8f;
    --cyan:#7cf9ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    overflow:hidden;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
    overscroll-behavior:none;
    background:
      radial-gradient(60% 50% at 50% 28%, rgba(90,45,150,.38), transparent 70%),
      radial-gradient(50% 40% at 82% 82%, rgba(255,80,140,.18), transparent 70%),
      radial-gradient(50% 40% at 14% 78%, rgba(0,180,255,.14), transparent 70%),
      #05060a;
  }
  canvas{position:fixed;inset:0;display:block}
  #bg{z-index:0}
  #fx{z-index:6;pointer-events:none}

  /* ---------- 开场遮罩 ---------- */
  #gate{
    position:fixed;inset:0;z-index:100;
    display:grid;place-items:center;
    text-align:center;padding:24px;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,180,60,.10), transparent 62%),
      #05060a;
    transition:opacity .75s ease, visibility .75s ease;
  }
  #gate.hide{opacity:0;visibility:hidden}
  .gate-inner{display:flex;flex-direction:column;align-items:center;gap:clamp(18px,4vmin,30px)}
  .gate-top{
    font-size:clamp(10px,2.8vmin,13px);
    letter-spacing:.5em;padding-left:.5em;
    color:rgba(255,209,102,.75);
  }
  #startBtn{
    position:relative;z-index:0;
    padding:clamp(15px,4vmin,19px) clamp(38px,11vmin,56px);
    border:0;border-radius:999px;cursor:pointer;
    font-size:clamp(15px,4.2vmin,19px);
    font-weight:800;letter-spacing:.22em;padding-right:calc(clamp(38px,11vmin,56px) - .22em);
    color:#120c04;
    background:linear-gradient(135deg,#fff3cc,#ffc247 42%,#ff9a3c);
    animation:breathe 2.6s ease-in-out infinite;
    font-family:inherit;
  }
  #startBtn::before{
    content:'';position:absolute;inset:-3px;border-radius:999px;z-index:-1;
    background:conic-gradient(from 0deg,#ffd166,#ff5f8f,#7cf9ff,#b78bff,#ffd166);
    filter:blur(13px);opacity:.85;
    animation:spin 5.5s linear infinite;
  }
  .gate-tip{font-size:clamp(11px,3vmin,13px);letter-spacing:.16em;color:rgba(255,255,255,.4)}
  @keyframes breathe{
    0%,100%{transform:scale(1);box-shadow:0 0 24px rgba(255,180,60,.5),0 0 70px rgba(255,120,0,.25)}
    50%{transform:scale(1.055);box-shadow:0 0 40px rgba(255,190,80,.85),0 0 110px rgba(255,140,0,.45)}
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 主舞台 ---------- */
  #stage{
    position:fixed;inset:0;z-index:2;
    display:grid;place-items:center;
    pointer-events:none;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }
  .content{
    position:relative;z-index:3;
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(8px,2vmin,20px);
    text-align:center;
  }

  /* 光晕 & 光环 */
  .halo{
    position:absolute;z-index:1;left:50%;top:48%;
    width:min(130vmin,820px);aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,
      rgba(255,190,80,.20) 0%,
      rgba(255,70,140,.13) 38%,
      rgba(120,60,255,.08) 58%,
      transparent 72%);
    filter:blur(22px);
    animation:pulse 6.5s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}50%{transform:translate(-50%,-50%) scale(1.09);opacity:1}}
  .ring{
    position:absolute;z-index:1;left:50%;top:48%;
    width:min(80vmin,560px);aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    background:conic-gradient(from 0deg, transparent 0 72%, rgba(255,200,110,.95) 86%, transparent 100%);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.6px));
            mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.6px));
    animation:spin 9s linear infinite;
  }
  .ring.r2{
    width:min(96vmin,680px);
    background:conic-gradient(from 180deg, transparent 0 78%, rgba(124,249,255,.75) 90%, transparent 100%);
    animation-duration:14s;animation-direction:reverse;
  }

  /* 文字 */
  .en{
    font-size:clamp(10px,2.8vmin,13px);
    letter-spacing:.44em;padding-left:.44em;
    color:rgba(255,209,102,.9);
    text-shadow:0 0 18px rgba(255,180,60,.55);
  }
  .title{
    display:flex;gap:.06em;
    perspective:700px;
    font-size:clamp(42px,13.5vmin,128px);
    font-weight:900;
    line-height:1.05;
    letter-spacing:.02em;
  }
  .title span{
    display:inline-block;
    background:linear-gradient(180deg,#fff8dd 0%,#ffd166 38%,#ff9a3c 66%,#ff5f8f 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 16px rgba(255,175,60,.6)) drop-shadow(0 0 40px rgba(255,90,140,.35));
    transform-origin:50% 100%;
  }
  .sub{
    font-size:clamp(13px,3.9vmin,19px);
    letter-spacing:.14em;padding-left:.14em;
    color:rgba(255,255,255,.92);
    text-shadow:0 0 22px rgba(255,95,143,.55);
  }

  /* 蛋糕 */
  .cake{
    --w:min(46vmin,230px);
    position:relative;
    width:var(--w);height:calc(var(--w) * 1.05);
    margin-top:clamp(4px,1.5vmin,14px);
    pointer-events:auto;
    cursor:pointer;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.6));
  }
  .plate{
    position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:112%;height:6%;border-radius:50%;
    background:radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.22), rgba(120,130,180,.10) 60%, transparent 72%);
    box-shadow:0 0 26px rgba(124,249,255,.22);
  }
  .layer{
    position:absolute;left:50%;transform:translateX(-50%);
    border-radius:12px 12px 16px 16px;
    box-shadow:
      inset 0 4px 0 rgba(255,200,110,.6),
      inset 0 -8px 18px rgba(0,0,0,.5),
      0 0 30px rgba(255,160,60,.22);
  }
  .layer::after{
    content:'';position:absolute;left:0;right:0;top:-6px;height:12px;border-radius:50%;
    background:linear-gradient(180deg,#ffe6b0,#ffb347);
    box-shadow:0 0 16px rgba(255,180,60,.5);
  }
  .l1{width:100%;height:34%;bottom:5%;background:linear-gradient(180deg,#40295f,#241a3c)}
  .l2{width:74%;height:28%;bottom:39%;background:linear-gradient(180deg,#503071,#2c1c4d)}
  .candle{
    position:absolute;left:50%;bottom:67%;
    width:clamp(6px,2.2vmin,11px);height:clamp(22px,8.6vmin,44px);
    transform:translateX(-50%);
    border-radius:4px;
    background:linear-gradient(180deg,#fff4cc,#ffb347 60%,#ff8c2e);
    box-shadow:0 0 14px rgba(255,190,80,.45);
  }
  .candle::before{ /* 烛芯 */
    content:'';position:absolute;left:50%;top:-4px;transform:translateX(-50%);
    width:2px;height:6px;background:#3a2a1a;border-radius:2px;
  }
  .flame{
    position:absolute;left:50%;bottom:100%;
    width:clamp(11px,3.8vmin,20px);height:clamp(16px,5.6vmin,28px);
    transform:translate(-50%,0) scale(1);
    transform-origin:50% 100%;
    transition:opacity .45s ease, transform .45s ease;
  }
  .flame i{
    position:absolute;inset:0;display:block;
    border-radius:50% 50% 46% 46% / 72% 72% 30% 30%;
    background:radial-gradient(ellipse at 50% 72%, #fffbe0 0%, #ffd85c 34%, #ff8c1a 62%, rgba(255,90,0,0) 82%);
    box-shadow:0 0 18px 5px rgba(255,175,45,.8), 0 0 52px 20px rgba(255,110,0,.32);
    animation:flicker .16s infinite alternate;
  }
  @keyframes flicker{
    0%{transform:scale(1,1) rotate(-1.5deg);opacity:.94}
    100%{transform:scale(1.06,1.1) rotate(1.5deg);opacity:1}
  }
  .cake.out .flame{opacity:0;transform:translate(-50%,-6px) scale(.15)}

  /* 消息 / 提示 */
  .msg{
    min-height:1.7em;
    max-width:min(90vw,640px);
    font-size:clamp(13px,3.6vmin,17px);
    line-height:1.75;letter-spacing:.06em;
    color:rgba(255,255,255,.85);
    text-shadow:0 0 18px rgba(255,180,80,.35);
  }
  .hint{
    font-size:clamp(11px,3vmin,13px);
    letter-spacing:.14em;
    color:rgba(255,255,255,.45);
  }

  @media (max-height:640px){
    .cake{--w:min(36vmin,170px)}
    .content{gap:6px}
    .msg{line-height:1.5}
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<div id="stage">
  <div class="halo"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>

  <div class="content">
    <p class="en" id="en">HAPPY BIRTHDAY</p>
    <h1 class="title" id="title"></h1>
    <p class="sub" id="sub">致我最酷的弟弟 · 生日快乐</p>

    <div class="cake" id="cake">
      <span class="flame"><i></i></span>
      <div class="candle"></div>
      <div class="layer l2"></div>
      <div class="layer l1"></div>
      <div class="plate"></div>
    </div>

    <p class="msg" id="msg"></p>
    <p class="hint" id="hint">点击蛋糕吹蜡烛 · 点击屏幕放烟花</p>
  </div>
</div>

<div id="gate">
  <div class="gate-inner">
    <p class="gate-top">A SPECIAL DAY</p>
    <button id="startBtn">开启祝福</button>
    <p class="gate-tip">建议开启声音 · 戴上耳机效果更佳</p>
  </div>
</div>

<audio id="music" src="music.mp3" loop preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  'use strict';

  /* ============ 基础 ============ */
  const bg  = document.getElementById('bg');
  const fx  = document.getElementById('fx');
  const bgx = bg.getContext('2d');
  const fxx = fx.getContext('2d');
  const gate   = document.getElementById('gate');
  const startBtn = document.getElementById('startBtn');
  const music  = document.getElementById('music');
  const cake   = document.getElementById('cake');
  const msgEl  = document.getElementById('msg');
  const hintEl = document.getElementById('hint');
  const titleEl = document.getElementById('title');

  let W = 0, H = 0, DPR = 1;
  let started = false;
  let stars = [];
  let parts = [];

  /* 标题拆字 */
  '生日快乐'.split('').forEach(function(ch){
    const s = document.createElement('span');
    s.textContent = ch;
    titleEl.appendChild(s);
  });

  /* ============ 画布尺寸 ============ */
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    [bg, fx].forEach(function(c){
      c.width  = Math.floor(W * DPR);
      c.height = Math.floor(H * DPR);
      c.style.width  = W + 'px';
      c.style.height = H + 'px';
    });
    bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fxx.setTransform(DPR, 0, 0, DPR, 0, 0);

    initStars();
  }

  function initStars(){
    const count = Math.min(Math.round(W * H / 7000), 260);
    stars = [];
    for(let i = 0; i < count; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        ph: Math.random() * Math.PI * 2,
        sp: 0.5 + Math.random() * 1.8,
        vy: 0.05 + Math.random() * 0.22
      });
    }
  }

  /* ============ 星空 ============ */
  function drawBg(t){
    bgx.clearRect(0, 0, W, H);

    for(let i = 0; i < stars.length; i++){
      const s = stars[i];
      s.y += s.vy;
      if(s.y > H + 2){ s.y = -2; s.x = Math.random() * W; }

      const a = 0.22 + 0.78 * Math.abs(Math.sin(t * s.sp + s.ph));

      bgx.beginPath();
      bgx.arc(s.x, s.y, s.r, 0, 6.2832);
      bgx.fillStyle = 'rgba(255,255,255,' + (a * 0.9).toFixed(3) + ')';
      bgx.fill();

      if(s.r > 1.15){
        bgx.beginPath();
        bgx.arc(s.x, s.y, s.r * 3.4, 0, 6.2832);
        bgx.fillStyle = 'rgba(170,205,255,' + (a * 0.10).toFixed(3) + ')';
        bgx.fill();
      }
    }
  }

  /* ============ 烟花粒子 ============ */
  const COLORS = ['#ffd166', '#ff5f8f', '#7cf9ff', '#b78bff', '#ff9a3c', '#fff6d5', '#5cff9d'];

  function burst(x, y, opt){
    opt = opt || {};
    const n = opt.count || 70;
    const power = opt.power || 6;

    for(let i = 0; i < n; i++){
      const a  = Math.random() * Math.PI * 2;
      const sp = power * (0.2 + Math.random() * 0.95);
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.008 + Math.random() * 0.014,
        color: opt.color || COLORS[(Math.random() * COLORS.length) | 0],
        size: 1 + Math.random() * 2.2
      });
    }
    if(parts.length > 2400) parts.splice(0, parts.length - 2400);
  }

  function drawFx(){
    /* 用 destination-out 做拖尾 */
    fxx.globalCompositeOperation = 'destination-out';
    fxx.fillStyle = 'rgba(0,0,0,0.17)';
    fxx.fillRect(0, 0, W, H);

    fxx.globalCompositeOperation = 'lighter';

    for(let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];

      p.x  += p.vx;
      p.y  += p.vy;
      p.vx *= 0.973;
      p.vy *= 0.973;
      p.vy += 0.055;
      p.life -= p.decay;

      if(p.life <= 0){
        parts.splice(i, 1);
        continue;
      }

      const alpha = Math.max(p.life, 0);
      fxx.globalAlpha = alpha;
      fxx.fillStyle = p.color;
      fxx.beginPath();
      fxx.arc(p.x, p.y, p.size * (0.4 + alpha * 0.9), 0, 6.2832);
      fxx.fill();

      /* 高光核 */
      if(p.size > 1.8){
        fxx.globalAlpha = alpha * 0.5;
        fxx.beginPath();
        fxx.arc(p.x, p.y, p.size * 2.6, 0, 6.2832);
        fxx.fill();
      }
    }

    fxx.globalAlpha = 1;
    fxx.globalCompositeOperation = 'source-over';
  }

  /* ============ 主循环 ============ */
  let startTime = 0;
  function loop(now){
    if(!startTime) startTime = now;
    const t = (now - startTime) / 1000;

    drawBg(t);
    drawFx();

    requestAnimationFrame(loop);
  }

  /* ============ 打字机 ============ */
  let typeToken = 0;
  function typeText(el, str, speed){
    const my = ++typeToken;
    el.textContent = '';
    let i = 0;
    (function step(){
      if(my !== typeToken) return;
      el.textContent = str.slice(0, ++i);
      if(i < str.length) setTimeout(step, speed || 58);
    })();
  }

  /* ============ 开场 ============ */
  function startExperience(){
    if(started) return;
    started = true;

    gate.classList.add('hide');

    /* 音乐：用户手势后播放 */
    music.volume = 0;
    const p = music.play();
    if(p && p.catch) p.catch(function(){ /* 没有 music.mp3 时静默忽略 */ });

    let v = 0;
    const fade = setInterval(function(){
      v += 0.035;
      if(v >= 0.8){ v = 0.8; clearInterval(fade); }
      try { music.volume = v; } catch(e){}
    }, 60);

    setTimeout(function(){ gate.style.display = 'none'; }, 900);

    runIntro();
  }

  function runIntro(){
    if(!window.gsap){
      /* 没有 GSAP 时的降级：直接触发烟花 */
      burst(W * 0.5, H * 0.3, {count: 90, power: 7});
      typeText(msgEl, '愿你的每一岁都奔走在热爱里，愿你永远明朗、坦荡、有光芒 ✨', 55);
      return;
    }

    const gsap = window.gsap;

    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

    tl.fromTo('.halo', { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.8 })
      .fromTo('.ring', { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.4, stagger: 0.2 }, '-=1.5')
      .fromTo('#en', { y: 24, opacity: 0 }, { y: 0, opacity: 0.9, duration: 0.9 }, '-=1.05')
      .fromTo('.title span',
        { y: 95, opacity: 0, rotateX: -85, scale: 0.7 },
        { y: 0, opacity: 1, rotateX: 0, scale: 1, duration: 1.1, stagger: 0.11, ease: 'back.out(1.6)' },
        '-=0.6')
      .fromTo('#sub', { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.85 }, '-=0.55')
      .fromTo('#cake', { y: 80, opacity: 0, scale: 0.6 },
        { y: 0, opacity: 1, scale: 1, duration: 1, ease: 'back.out(1.5)' }, '-=0.55')
      .fromTo('#hint', { opacity: 0 }, { opacity: 1, duration: 1 }, '-=0.5')
      .add(function(){
        burst(W * 0.5, H * 0.30, { count: 95, power: 7.2 });
        setTimeout(function(){ burst(W * 0.20, H * 0.45, { count: 65, power: 6 }); }, 280);
        setTimeout(function(){ burst(W * 0.80, H * 0.42, { count: 65, power: 6 }); }, 560);
        setTimeout(function(){
          typeText(msgEl, '愿你的每一岁都奔走在热爱里，愿你永远明朗、坦荡、有光芒 ✨', 58);
        }, 700);
      }, '-=0.2');

    /* 蛋糕轻轻浮动 */
    gsap.to('#cake', {
      y: -9, duration: 2.3, yoyo: true, repeat: -1,
      ease: 'sine.inOut', delay: 4
    });
  }

  /* ============ 吹蜡烛 ============ */
  function blowCandle(){
    if(cake.classList.contains('out')) return;
    cake.classList.add('out');

    const r  = cake.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height * 0.22;

    for(let i = 0; i < 7; i++){
      (function(k){
        setTimeout(function(){
          burst(
            cx + (Math.random() - 0.5) * r.width * 2.2,
            cy - Math.random() * 110 - 20,
            { count: 62, power: 7.4 }
          );
        }, k * 170);
      })(i);
    }

    setTimeout(function(){
      typeText(msgEl, '愿望已许下 ✨ 愿你想要的都拥有，得不到的都释怀', 55);
      hintEl.textContent = '点击屏幕任意位置，再放一朵烟花';
    }, 350);
  }

  /* ============ 事件 ============ */
  startBtn.addEventListener('click', startExperience, { passive: true });

  window.addEventListener('pointerdown', function(e){
    if(!started) return;
    if(e.target && e.target.closest && e.target.closest('#cake')) return;
    burst(e.clientX, e.clientY, { count: 32, power: 4.6 });
  }, { passive: true });

  cake.addEventListener('click', function(e){
    e.stopPropagation();
    blowCandle();
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){
    setTimeout(resize, 220);
  });

  /* ============ 启动 ============ */
  resize();
  requestAnimationFrame(loop);

  /* 开场遮罩上先撒一点星光 */
  setTimeout(function(){
    burst(W * 0.5, H * 0.34, { count: 40, power: 3.6 });
  }, 400);
})();
</script>
</body>
</html>

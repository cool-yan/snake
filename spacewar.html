<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space War</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050510;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #0b0d1b 0%, #020307 100%);
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
            color: #00ffcc;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // Resize canvas to fill the viewport
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Input state
        const keys = { w: false, a: false, s: false, d: false };
        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let score = 0;

        // Player configuration
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 18,
            speed: 5,
            angle: 0
        };

        // Entities arrays
        const bullets = [];
        const enemies = [];
        const particles = [];
        const stars = [];

        // Generate background stars
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                alpha: Math.random()
            });
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) shootBullet();
        });

        // Shooting mechanics
        function shootBullet() {
            const dx = mouse.x - player.x;
            const dy = mouse.y - player.y;
            const angle = Math.atan2(dy, dx);
            const speed = 12;

            bullets.push({
                x: player.x + Math.cos(angle) * player.radius,
                y: player.y + Math.sin(angle) * player.radius,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 4
            });
        }

        // Enemy generation
        function spawnEnemy() {
            const radius = Math.random() * 12 + 16;
            const x = Math.random() * (canvas.width - radius * 2) + radius;
            const y = Math.random() * (canvas.height - radius * 2) + radius;

            // Ensure enemy doesn't spawn right on top of player
            const dist = Math.hypot(player.x - x, player.y - y);
            if (dist < 150) return spawnEnemy();

            // Random initial velocity
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 2 + 1.5;

            enemies.push({
                x,
                y,
                radius,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: `#ff${Math.floor(Math.random() * 150 + 50).toString(16)}33`,
                changeDirTimer: Math.random() * 100 + 50
            });
        }

        // Particle explosion effect
        function createExplosion(x, y, color) {
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015,
                    color
                });
            }
        }

        // Keep target enemy population around 8
        setInterval(() => {
            if (enemies.length < 8) spawnEnemy();
        }, 1200);

        // Initial spawns
        for (let i = 0; i < 5; i++) spawnEnemy();

        // Main Game Loop
        function update() {
            // --- Player Movement ---
            if (keys.w && player.y - player.radius > 0) player.y -= player.speed;
            if (keys.s && player.y + player.radius < canvas.height) player.y += player.speed;
            if (keys.a && player.x - player.radius > 0) player.x -= player.speed;
            if (keys.d && player.x + player.radius < canvas.width) player.x += player.speed;

            // Player rotation facing mouse
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            // --- Update Bullets ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // Remove bullets out of screen bounds
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // --- Update Enemies ---
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];

                // Random direction shifts
                e.changeDirTimer--;
                if (e.changeDirTimer <= 0) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 2 + 1.5;
                    e.vx = Math.cos(angle) * speed;
                    e.vy = Math.sin(angle) * speed;
                    e.changeDirTimer = Math.random() * 120 + 60;
                }

                e.x += e.vx;
                e.y += e.vy;

                // Wall collision bounce (strictly constrained inside window)
                if (e.x - e.radius <= 0) {
                    e.x = e.radius;
                    e.vx *= -1;
                } else if (e.x + e.radius >= canvas.width) {
                    e.x = canvas.width - e.radius;
                    e.vx *= -1;
                }

                if (e.y - e.radius <= 0) {
                    e.y = e.radius;
                    e.vy *= -1;
                } else if (e.y + e.radius >= canvas.height) {
                    e.y = canvas.height - e.radius;
                    e.vy *= -1;
                }

                // --- Bullet & Enemy Collisions ---
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    const dist = Math.hypot(b.x - e.x, b.y - e.y);

                    if (dist < e.radius + b.radius) {
                        // Collision hit!
                        createExplosion(e.x, e.y, e.color);
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);

                        score += 100;
                        scoreEl.textContent = score;
                        break;
                    }
                }
            }

            // --- Update Explosion Particles ---
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Stars
            stars.forEach(s => {
                ctx.save();
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Bullets
            bullets.forEach(b => {
                ctx.save();
                ctx.fillStyle = '#ffcc00';
                ctx.shadowColor = '#ff9900';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Enemies
            enemies.forEach(e => {
                ctx.save();
                ctx.fillStyle = e.color;
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();

                // Inner core
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Player Spaceship
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            // Ship Body
            ctx.fillStyle = '#00ffcc';
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(player.radius, 0);
            ctx.lineTo(-player.radius, -player.radius * 0.7);
            ctx.lineTo(-player.radius * 0.5, 0);
            ctx.lineTo(-player.radius, player.radius * 0.7);
            ctx.closePath();
            ctx.fill();

            // Cockpit Core
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>

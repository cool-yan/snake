<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔方打乱生成器</title>
<style>
  :root{
    --U:#ffffff; --D:#ffd500; --F:#009b48; --B:#0045ad; --L:#ff5800; --R:#b90000;
    --bg:#0f1115; --panel:#1a1d24; --panel2:#20242c; --text:#e8e9ec; --muted:#9aa0ab;
    --accent:#5b8cff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:20px; min-height:100vh;
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:760px;}
  h1{font-size:22px; margin:4px 0 20px; text-align:center; letter-spacing:1px;}
  .card{
    background:var(--panel); border-radius:14px; padding:18px 20px;
    margin-bottom:16px; box-shadow:0 4px 16px rgba(0,0,0,.25);
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center;}
  select, button{
    font-size:15px; padding:9px 16px; border-radius:9px; border:1px solid #333944;
    background:var(--panel2); color:var(--text); cursor:pointer; transition:.15s;
  }
  button{border:1px solid var(--accent); background:linear-gradient(180deg,#3a5fd9,#2b48b0); color:#fff; font-weight:600;}
  button:hover{filter:brightness(1.1);}
  button:disabled{opacity:.4; cursor:not-allowed; filter:none;}
  button.secondary{background:var(--panel2); border-color:#333944; color:var(--text); font-weight:500;}
  .scramble-box{
    font-family:"Consolas",monospace; font-size:19px; letter-spacing:1px;
    text-align:center; padding:14px; background:var(--panel2); border-radius:10px;
    margin-top:14px; word-spacing:6px; line-height:1.8;
  }
  .scramble-box .mv{display:inline-block; padding:2px 6px; border-radius:5px;}
  .scramble-box .mv.cur{background:var(--accent); color:#fff;}
  .label{color:var(--muted); font-size:13px; margin-bottom:6px; text-align:center;}
  .net{
    display:grid; grid-template-columns:repeat(4, 60px); grid-template-rows:repeat(3, 60px);
    gap:6px; justify-content:center; margin:20px auto;
  }
  .facegrid{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:2px; width:100%; height:100%;}
  .sticker{border-radius:3px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);}
  .faceU{grid-column:2/3; grid-row:1/2;}
  .faceL{grid-column:1/2; grid-row:2/3;}
  .faceF{grid-column:2/3; grid-row:2/3;}
  .faceR{grid-column:3/4; grid-row:2/3;}
  .faceB{grid-column:4/5; grid-row:2/3;}
  .faceD{grid-column:2/3; grid-row:3/4;}
  .note{font-size:13px; color:var(--muted); line-height:1.7; margin-top:10px;}
  .solution-box{
    font-family:"Consolas",monospace; font-size:17px; text-align:center;
    padding:12px; background:var(--panel2); border-radius:10px; margin-top:12px; line-height:1.8;
  }
  .solution-box .mv{display:inline-block; padding:2px 6px; border-radius:5px; margin:1px;}
  .solution-box .mv.done{color:var(--muted);}
  .solution-box .mv.cur{background:var(--accent); color:#fff;}
  .player{display:flex; justify-content:center; align-items:center; gap:10px; margin-top:14px;}
  .progress{font-size:13px; color:var(--muted); min-width:70px; text-align:center;}
  @media (max-width:480px){
    .net{grid-template-columns:repeat(4, 46px); grid-template-rows:repeat(3, 46px);}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧩 魔方打乱公式生成器</h1>

  <div class="card">
    <div class="row">
      <label style="color:var(--muted); font-size:14px;">步数：
        <select id="lenSelect">
          <option value="15">15 步</option>
          <option value="20" selected>20 步（标准 WCA）</option>
          <option value="25">25 步</option>
        </select>
      </label>
      <button id="genBtn">🔀 生成新的打乱</button>
    </div>
    <div class="scramble-box" id="scrambleBox">点击"生成新的打乱"开始</div>
  </div>

  <div class="card">
    <div class="label">打乱后的魔方状态（展开图）</div>
    <div class="net" id="net"></div>
    <div class="note">上：U（白）　中排从左到右：L（橙）F（绿）R（红）B（蓝）　下：D（黄）</div>
  </div>

  <div class="card">
    <div class="label" id="solLabel">还原步骤</div>
    <div class="solution-box" id="solutionBox">— 请先生成打乱 —</div>
    <div class="player">
      <button class="secondary" id="prevBtn" disabled>⏮ 上一步</button>
      <button id="playBtn" disabled>▶ 自动播放</button>
      <button class="secondary" id="nextBtn" disabled>下一步 ⏭</button>
      <span class="progress" id="progress">0 / 0</span>
    </div>
    <div class="note">
      ⚠️ 说明：这里给出的还原步骤是「打乱公式的严格逆序」，数学上保证一定能把魔方还原，
      步数与打乱步数相同（并非全局最少步数）。真正的「最短步数还原」（如 Kociemba 二阶段算法／上帝之数求解）
      需要复杂的搜索算法，计算量较大，本页面暂未实现最优求解器，先提供这个一定正确、逻辑简单的还原方案。
    </div>
  </div>
</div>

<script>
/* ===================== 经过测试验证的 3D 魔方状态引擎 ===================== */
const FACES = {
  U: { normal:[0,1,0],  right:[1,0,0],  up:[0,0,-1], color:'U' },
  D: { normal:[0,-1,0], right:[1,0,0],  up:[0,0,1],  color:'D' },
  F: { normal:[0,0,1],  right:[1,0,0],  up:[0,1,0],  color:'F' },
  B: { normal:[0,0,-1], right:[-1,0,0], up:[0,1,0],  color:'B' },
  L: { normal:[-1,0,0], right:[0,0,-1], up:[0,1,0],  color:'L' },
  R: { normal:[1,0,0],  right:[0,0,1],  up:[0,1,0],  color:'R' },
};
const AXIS_OF = { U:'y', D:'y', F:'z', B:'z', L:'x', R:'x' };

function vadd(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function vscale(a,s){return [a[0]*s,a[1]*s,a[2]*s];}
function round(x){ return Math.round(x); }

function makeSolvedStickers(){
  const stickers = [];
  for(const fname of Object.keys(FACES)){
    const f = FACES[fname];
    for(let v=1; v>=-1; v--){
      for(let u=-1; u<=1; u++){
        const pos = vadd(vadd(vscale(f.normal,1), vscale(f.right,u)), vscale(f.up,v));
        stickers.push({ color:f.color, pos:pos, normal:f.normal.slice() });
      }
    }
  }
  return stickers;
}
function rotAxis(p, axis, theta){
  const c = Math.round(Math.cos(theta)), s = Math.round(Math.sin(theta));
  let [x,y,z] = p;
  if(axis==='x') return [x, y*c - z*s, y*s + z*c];
  if(axis==='y') return [x*c + z*s, y, -x*s + z*c];
  return [x*c - y*s, x*s + y*c, z];
}
function applyMoveSticker(stickers, face, quarterTurns){
  const def = FACES[face];
  const axis = AXIS_OF[face];
  const idx = axis==='x'?0:axis==='y'?1:2;
  const normalSignAxisVal = def.normal[idx];
  const baseTheta = -Math.PI/2 * Math.sign(normalSignAxisVal);
  const theta = baseTheta * quarterTurns;
  for(const st of stickers){
    if(round(st.pos[idx]) === normalSignAxisVal){
      st.pos = rotAxis(st.pos, axis, theta).map(round);
      st.normal = rotAxis(st.normal, axis, theta).map(round);
    }
  }
}
function applyMove(stickers, move){
  const face = move[0], mod = move.slice(1);
  if(mod==='') applyMoveSticker(stickers, face, 1);
  else if(mod==="'") applyMoveSticker(stickers, face, -1);
  else if(mod==='2') applyMoveSticker(stickers, face, 2);
}
function applyMoves(stickers, moves){ moves.forEach(m=>applyMove(stickers,m)); }
function findFaceByNormal(n){
  for(const fname of Object.keys(FACES)){
    const fn = FACES[fname].normal;
    if(fn[0]===n[0] && fn[1]===n[1] && fn[2]===n[2]) return fname;
  }
  return null;
}
function toFaceArrays(stickers){
  const out = {};
  for(const fname of Object.keys(FACES)) out[fname] = new Array(9).fill(null);
  for(const st of stickers){
    const fname = findFaceByNormal(st.normal);
    const f = FACES[fname];
    const rel = [st.pos[0]-f.normal[0], st.pos[1]-f.normal[1], st.pos[2]-f.normal[2]];
    const u = rel[0]*f.right[0]+rel[1]*f.right[1]+rel[2]*f.right[2];
    const v = rel[0]*f.up[0]+rel[1]*f.up[1]+rel[2]*f.up[2];
    const row = 1-round(v), col = 1+round(u);
    out[fname][row*3+col] = st.color;
  }
  return out;
}
/* ===================== 打乱生成 ===================== */
const AXIS_GROUP = { U:'y', D:'y', F:'z', B:'z', L:'x', R:'x' };
function genScramble(len){
  const facesArr = ['U','D','F','B','L','R'];
  const mods = ['',"'",'2'];
  const moves = [];
  let lastFace=null, lastAxis=null, axisStreak=0;
  while(moves.length < len){
    const f = facesArr[Math.floor(Math.random()*6)];
    if(f===lastFace) continue;
    const axis = AXIS_GROUP[f];
    if(axis===lastAxis){
      axisStreak++;
      if(axisStreak>=2) continue; // 避免同轴（如 R L R）连续超过2次
    } else axisStreak=0;
    const mod = mods[Math.floor(Math.random()*3)];
    moves.push(f+mod);
    lastFace=f; lastAxis=axis;
  }
  return moves;
}
function invertMove(m){
  if(m.endsWith('2')) return m;
  if(m.endsWith("'")) return m[0];
  return m+"'";
}
function invertMoves(moves){ return moves.slice().reverse().map(invertMove); }

/* ===================== 渲染 ===================== */
const netEl = document.getElementById('net');
const faceOrder = ['U','L','F','R','B','D'];
const faceClass = {U:'faceU',L:'faceL',F:'faceF',R:'faceR',B:'faceB',D:'faceD'};
function buildNetSkeleton(){
  netEl.innerHTML='';
  faceOrder.forEach(fn=>{
    const cell = document.createElement('div');
    cell.className = faceClass[fn];
    const grid = document.createElement('div');
    grid.className = 'facegrid';
    grid.id = 'grid-'+fn;
    for(let i=0;i<9;i++){
      const s = document.createElement('div');
      s.className='sticker';
      grid.appendChild(s);
    }
    cell.appendChild(grid);
    netEl.appendChild(cell);
  });
}
function renderState(faceArrays){
  faceOrder.forEach(fn=>{
    const grid = document.getElementById('grid-'+fn);
    const stickers = grid.children;
    for(let i=0;i<9;i++){
      stickers[i].style.background = 'var(--'+faceArrays[fn][i]+')';
    }
  });
}
buildNetSkeleton();

/* ===================== 交互逻辑 ===================== */
let currentScramble = [];
let solutionMoves = [];
let solvedBase = null;   // stickers state right after scramble (= 0 solution steps applied)
let stepIndex = 0;       // how many solution moves have been applied so far
let playTimer = null;

const scrambleBox = document.getElementById('scrambleBox');
const solutionBox = document.getElementById('solutionBox');
const progressEl = document.getElementById('progress');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const playBtn = document.getElementById('playBtn');

function renderScrambleBox(){
  scrambleBox.innerHTML = currentScramble.map((m,i)=>`<span class="mv" data-i="${i}">${m}</span>`).join(' ');
}
function renderSolutionBox(){
  solutionBox.innerHTML = solutionMoves.map((m,i)=>{
    let cls = 'mv';
    if(i < stepIndex) cls += ' done';
    if(i === stepIndex) cls += ' cur';
    return `<span class="${cls}">${m}</span>`;
  }).join(' ');
  progressEl.textContent = `${stepIndex} / ${solutionMoves.length}`;
  prevBtn.disabled = stepIndex<=0;
  nextBtn.disabled = stepIndex>=solutionMoves.length;
}
function renderAtStep(){
  const stickers = solvedBase.map(s=>({color:s.color, pos:s.pos.slice(), normal:s.normal.slice()}));
  applyMoves(stickers, solutionMoves.slice(0, stepIndex));
  renderState(toFaceArrays(stickers));
  renderSolutionBox();
}
function newScramble(){
  stopPlay();
  const len = parseInt(document.getElementById('lenSelect').value,10);
  currentScramble = genScramble(len);
  solutionMoves = invertMoves(currentScramble);
  const stickers = makeSolvedStickers();
  applyMoves(stickers, currentScramble);
  solvedBase = stickers;
  stepIndex = 0;
  renderScrambleBox();
  renderAtStep();
  playBtn.disabled = false;
}
function stopPlay(){
  if(playTimer){ clearInterval(playTimer); playTimer=null; playBtn.textContent='▶ 自动播放'; }
}
document.getElementById('genBtn').addEventListener('click', newScramble);
prevBtn.addEventListener('click', ()=>{ stopPlay(); if(stepIndex>0){ stepIndex--; renderAtStep(); } });
nextBtn.addEventListener('click', ()=>{ stopPlay(); if(stepIndex<solutionMoves.length){ stepIndex++; renderAtStep(); } });
playBtn.addEventListener('click', ()=>{
  if(playTimer){ stopPlay(); return; }
  if(stepIndex>=solutionMoves.length) { stepIndex = 0; renderAtStep(); }
  playBtn.textContent = '⏸ 暂停';
  playTimer = setInterval(()=>{
    if(stepIndex>=solutionMoves.length){ stopPlay(); return; }
    stepIndex++;
    renderAtStep();
  }, 700);
});

// 初始生成一次
newScramble();
</script>
</body>
</html>
